<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560">

<style>
  .title { font: 700 28px Arial, sans-serif; fill: #2b2457; }
  .label { font: 600 20px Arial, sans-serif; fill: #2b2457; }
  .small { font: 500 16px Arial, sans-serif; fill: #3a3652; }
  .tiny { font: 500 14px Arial, sans-serif; fill: #4a465f; }
  .box { fill: #f4efff; stroke: #8d72e1; stroke-width: 2; rx: 16; }
  .box2 { fill: #eef7ff; stroke: #65a7e8; stroke-width: 2; rx: 16; }
  .box3 { fill: #f1fff4; stroke: #5eba74; stroke-width: 2; rx: 16; }
  .warn { fill: #fff4e8; stroke: #ee9b43; stroke-width: 2; rx: 16; }
  .arrow { stroke: #6f55d9; stroke-width: 3; fill: none; marker-end: url(#arrow); }
  .arrow2 { stroke: #2d8dc9; stroke-width: 3; fill: none; marker-end: url(#arrow2); }
  .muted { fill: #fafafa; stroke: #d9d4ee; stroke-width: 1.5; rx: 12; }
</style>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#6f55d9" /></marker>
  <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2d8dc9" /></marker>
</defs>

<rect width="100%" height="100%" fill="white"/>

<text x="550" y="45" class="title" text-anchor="middle">교착상태와 기아상태</text>
<rect x="90" y="120" width="430" height="320" class="warn" /><text x="305" y="165" class="label" text-anchor="middle">교착상태 Deadlock</text><text x="305" y="205" class="small" text-anchor="middle">서로 상대방의 자원을 기다려</text><text x="305" y="235" class="small" text-anchor="middle">아무 작업도 끝나지 않는 상태</text>
<circle cx="230" cy="330" r="55" fill="#fff" stroke="#ee9b43" stroke-width="2"/><text x="230" y="337" class="label" text-anchor="middle">P1</text>
<circle cx="380" cy="330" r="55" fill="#fff" stroke="#ee9b43" stroke-width="2"/><text x="380" y="337" class="label" text-anchor="middle">P2</text>
<path d="M285 320 C315 285 345 285 375 320" class="arrow"/>
<path d="M375 350 C345 385 315 385 285 350" class="arrow"/>
<rect x="590" y="120" width="430" height="320" class="box2" /><text x="805" y="165" class="label" text-anchor="middle">기아상태 Starvation</text><text x="805" y="205" class="small" text-anchor="middle">우선순위가 낮아</text><text x="805" y="235" class="small" text-anchor="middle">자원을 계속 받지 못하는 상태</text>
<rect x="660" y="300" width="110" height="70" class="box3" /><text x="715" y="343" class="small" text-anchor="middle">높음</text>
<rect x="800" y="300" width="110" height="70" class="box3" /><text x="855" y="343" class="small" text-anchor="middle">높음</text>
<rect x="920" y="300" width="70" height="70" class="warn" /><text x="955" y="343" class="small" text-anchor="middle">낮음</text>
<text x="805" y="475" class="small" text-anchor="middle">교착상태는 멈춤, 기아상태는 계속 밀림으로 이해하면 쉽다.</text>

</svg>