<svg xmlns="http://www.w3.org/2000/svg" width="900" height="700" viewBox="0 0 900 700">

<style>
  .title { font: 700 28px Arial, sans-serif; fill: #2b2457; }
  .label { font: 600 20px Arial, sans-serif; fill: #2b2457; }
  .small { font: 500 16px Arial, sans-serif; fill: #3a3652; }
  .tiny { font: 500 14px Arial, sans-serif; fill: #4a465f; }
  .box { fill: #f4efff; stroke: #8d72e1; stroke-width: 2; rx: 16; }
  .box2 { fill: #eef7ff; stroke: #65a7e8; stroke-width: 2; rx: 16; }
  .box3 { fill: #f1fff4; stroke: #5eba74; stroke-width: 2; rx: 16; }
  .warn { fill: #fff4e8; stroke: #ee9b43; stroke-width: 2; rx: 16; }
  .arrow { stroke: #6f55d9; stroke-width: 3; fill: none; marker-end: url(#arrow); }
  .arrow2 { stroke: #2d8dc9; stroke-width: 3; fill: none; marker-end: url(#arrow2); }
  .muted { fill: #fafafa; stroke: #d9d4ee; stroke-width: 1.5; rx: 12; }
</style>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#6f55d9" /></marker>
  <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2d8dc9" /></marker>
</defs>

<rect width="100%" height="100%" fill="white"/>

<text x="450" y="45" class="title" text-anchor="middle">프로세스 메모리 구조</text>
<rect x="260" y="100" width="380" height="100" class="warn" /><text x="450" y="145" class="label" text-anchor="middle">Stack</text><text x="450" y="175" class="small" text-anchor="middle">지역 변수, 매개변수 / 함수 호출</text>
<rect x="260" y="220" width="380" height="100" class="box3" /><text x="450" y="265" class="label" text-anchor="middle">Heap</text><text x="450" y="295" class="small" text-anchor="middle">동적 메모리 할당 영역</text>
<rect x="260" y="340" width="380" height="100" class="box2" /><text x="450" y="385" class="label" text-anchor="middle">Data</text><text x="450" y="415" class="small" text-anchor="middle">전역 변수, 정적 변수</text>
<rect x="260" y="460" width="380" height="100" class="box" /><text x="450" y="505" class="label" text-anchor="middle">Code</text><text x="450" y="535" class="small" text-anchor="middle">CPU가 실행할 명령어</text>
<text x="450" y="625" class="small" text-anchor="middle">정적 영역은 실행 중 잘 변하지 않고, 동적 영역은 실행 중 계속 변할 수 있다.</text>

</svg>