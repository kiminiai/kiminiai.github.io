<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="580" viewBox="0 0 1100 580">

<style>
  .title { font: 700 28px Arial, sans-serif; fill: #2b2457; }
  .label { font: 600 20px Arial, sans-serif; fill: #2b2457; }
  .small { font: 500 16px Arial, sans-serif; fill: #3a3652; }
  .tiny { font: 500 14px Arial, sans-serif; fill: #4a465f; }
  .box { fill: #f4efff; stroke: #8d72e1; stroke-width: 2; rx: 16; }
  .box2 { fill: #eef7ff; stroke: #65a7e8; stroke-width: 2; rx: 16; }
  .box3 { fill: #f1fff4; stroke: #5eba74; stroke-width: 2; rx: 16; }
  .warn { fill: #fff4e8; stroke: #ee9b43; stroke-width: 2; rx: 16; }
  .arrow { stroke: #6f55d9; stroke-width: 3; fill: none; marker-end: url(#arrow); }
  .arrow2 { stroke: #2d8dc9; stroke-width: 3; fill: none; marker-end: url(#arrow2); }
  .muted { fill: #fafafa; stroke: #d9d4ee; stroke-width: 1.5; rx: 12; }
</style>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#6f55d9" /></marker>
  <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2d8dc9" /></marker>
</defs>

<rect width="100%" height="100%" fill="white"/>

<text x="550" y="45" class="title" text-anchor="middle">파일 시스템, 저장장치, 마운트</text>
<rect x="80" y="130" width="260" height="260" class="box" /><text x="210" y="175" class="label" text-anchor="middle">파일 시스템</text><text x="210" y="220" class="small" text-anchor="middle">파일을 쉽게 찾고</text><text x="210" y="250" class="small" text-anchor="middle">읽고 쓰도록 관리</text>
<rect x="420" y="130" width="260" height="260" class="box2" /><text x="550" y="175" class="label" text-anchor="middle">저장장치</text><text x="550" y="220" class="small" text-anchor="middle">HDD: 플래터/헤드</text><text x="550" y="250" class="small" text-anchor="middle">SSD: 전기적 저장</text>
<rect x="760" y="130" width="260" height="260" class="box3" /><text x="890" y="175" class="label" text-anchor="middle">마운트</text><text x="890" y="220" class="small" text-anchor="middle">물리 장치를</text><text x="890" y="250" class="small" text-anchor="middle">디렉터리에 연결</text>
<line x1="340" y1="260" x2="420" y2="260" class="arrow" /><line x1="680" y1="260" x2="760" y2="260" class="arrow" />
<rect x="240" y="450" width="620" height="70" class="warn" /><text x="550" y="492" class="small" text-anchor="middle">마운트를 해야 운영체제가 저장장치를 인식하고 접근할 수 있다.</text>

</svg>