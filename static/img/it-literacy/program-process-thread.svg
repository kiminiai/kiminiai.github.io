<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500">

<style>
  .title { font: 700 28px Arial, sans-serif; fill: #2b2457; }
  .label { font: 600 20px Arial, sans-serif; fill: #2b2457; }
  .small { font: 500 16px Arial, sans-serif; fill: #3a3652; }
  .tiny { font: 500 14px Arial, sans-serif; fill: #4a465f; }
  .box { fill: #f4efff; stroke: #8d72e1; stroke-width: 2; rx: 16; }
  .box2 { fill: #eef7ff; stroke: #65a7e8; stroke-width: 2; rx: 16; }
  .box3 { fill: #f1fff4; stroke: #5eba74; stroke-width: 2; rx: 16; }
  .warn { fill: #fff4e8; stroke: #ee9b43; stroke-width: 2; rx: 16; }
  .arrow { stroke: #6f55d9; stroke-width: 3; fill: none; marker-end: url(#arrow); }
  .arrow2 { stroke: #2d8dc9; stroke-width: 3; fill: none; marker-end: url(#arrow2); }
  .muted { fill: #fafafa; stroke: #d9d4ee; stroke-width: 1.5; rx: 12; }
</style>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#6f55d9" /></marker>
  <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2d8dc9" /></marker>
</defs>

<rect width="100%" height="100%" fill="white"/>

<text x="500" y="45" class="title" text-anchor="middle">프로그램, 프로세스, 스레드</text>
<rect x="80" y="160" width="220" height="110" class="box" /><text x="190" y="200" class="label" text-anchor="middle">프로그램</text><text x="190" y="230" class="small" text-anchor="middle">명령어들의 모음</text>
<line x1="300" y1="215" x2="390" y2="215" class="arrow" /><text x="345" y="190" class="small" text-anchor="middle">실행</text>
<rect x="390" y="140" width="260" height="150" class="box2" /><text x="520" y="185" class="label" text-anchor="middle">프로세스</text><text x="520" y="215" class="small" text-anchor="middle">실행 중인 프로그램</text><text x="520" y="245" class="small" text-anchor="middle">독립 메모리 할당</text>
<line x1="650" y1="215" x2="740" y2="215" class="arrow" />
<rect x="740" y="110" width="190" height="80" class="box3" /><text x="835" y="145" class="label" text-anchor="middle">스레드 1</text>
<rect x="740" y="220" width="190" height="80" class="box3" /><text x="835" y="255" class="label" text-anchor="middle">스레드 2</text>
<text x="500" y="390" class="small" text-anchor="middle">스레드는 프로세스 내부의 실행 흐름이며, 같은 프로세스의 자원을 공유한다.</text>

</svg>