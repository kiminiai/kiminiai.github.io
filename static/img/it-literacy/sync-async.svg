<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520">

<style>
  .title { font: 700 28px Arial, sans-serif; fill: #2b2457; }
  .label { font: 600 20px Arial, sans-serif; fill: #2b2457; }
  .small { font: 500 16px Arial, sans-serif; fill: #3a3652; }
  .tiny { font: 500 14px Arial, sans-serif; fill: #4a465f; }
  .box { fill: #f4efff; stroke: #8d72e1; stroke-width: 2; rx: 16; }
  .box2 { fill: #eef7ff; stroke: #65a7e8; stroke-width: 2; rx: 16; }
  .box3 { fill: #f1fff4; stroke: #5eba74; stroke-width: 2; rx: 16; }
  .warn { fill: #fff4e8; stroke: #ee9b43; stroke-width: 2; rx: 16; }
  .arrow { stroke: #6f55d9; stroke-width: 3; fill: none; marker-end: url(#arrow); }
  .arrow2 { stroke: #2d8dc9; stroke-width: 3; fill: none; marker-end: url(#arrow2); }
  .muted { fill: #fafafa; stroke: #d9d4ee; stroke-width: 1.5; rx: 12; }
</style>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#6f55d9" /></marker>
  <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2d8dc9" /></marker>
</defs>

<rect width="100%" height="100%" fill="white"/>

<text x="500" y="45" class="title" text-anchor="middle">동기와 비동기 통신의 차이</text>
<rect x="80" y="120" width="360" height="300" class="box" /><text x="260" y="165" class="label" text-anchor="middle">동기</text><text x="260" y="205" class="small" text-anchor="middle">요청 결과가 올 때까지</text><text x="260" y="235" class="small" text-anchor="middle">기다린 뒤 다음 작업 진행</text>
<line x1="160" y1="290" x2="360" y2="290" class="arrow" /><text x="260" y="325" class="small" text-anchor="middle">요청 → 응답 → 다음 작업</text>
<rect x="560" y="120" width="360" height="300" class="box2" /><text x="740" y="165" class="label" text-anchor="middle">비동기</text><text x="740" y="205" class="small" text-anchor="middle">요청 결과를 기다리지 않고</text><text x="740" y="235" class="small" text-anchor="middle">다른 작업을 계속 진행</text>
<line x1="620" y1="285" x2="820" y2="285" class="arrow2" /><line x1="620" y1="335" x2="820" y2="335" class="arrow2" /><text x="740" y="372" class="small" text-anchor="middle">댓글 작성, SNS 피드처럼</text>
<text x="740" y="396" class="small" text-anchor="middle">화면 이동 없이 처리되는 기능</text>

</svg>