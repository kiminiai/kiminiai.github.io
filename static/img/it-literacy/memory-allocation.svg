<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620">

<style>
  .title { font: 700 28px Arial, sans-serif; fill: #2b2457; }
  .label { font: 600 20px Arial, sans-serif; fill: #2b2457; }
  .small { font: 500 16px Arial, sans-serif; fill: #3a3652; }
  .tiny { font: 500 14px Arial, sans-serif; fill: #4a465f; }
  .box { fill: #f4efff; stroke: #8d72e1; stroke-width: 2; rx: 16; }
  .box2 { fill: #eef7ff; stroke: #65a7e8; stroke-width: 2; rx: 16; }
  .box3 { fill: #f1fff4; stroke: #5eba74; stroke-width: 2; rx: 16; }
  .warn { fill: #fff4e8; stroke: #ee9b43; stroke-width: 2; rx: 16; }
  .arrow { stroke: #6f55d9; stroke-width: 3; fill: none; marker-end: url(#arrow); }
  .arrow2 { stroke: #2d8dc9; stroke-width: 3; fill: none; marker-end: url(#arrow2); }
  .muted { fill: #fafafa; stroke: #d9d4ee; stroke-width: 1.5; rx: 12; }
</style>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#6f55d9" /></marker>
  <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2d8dc9" /></marker>
</defs>

<rect width="100%" height="100%" fill="white"/>

<text x="550" y="45" class="title" text-anchor="middle">연속 할당과 불연속 할당</text>
<text x="270" y="105" class="label" text-anchor="middle">연속 할당</text>
<rect x="70" y="140" width="100" height="80" class="box" /><text x="120" y="185" class="label" text-anchor="middle">A</text>
<rect x="170" y="140" width="160" height="80" class="box2" /><text x="250" y="185" class="label" text-anchor="middle">B</text>
<rect x="330" y="140" width="80" height="80" class="muted" /><text x="370" y="185" class="small" text-anchor="middle">빈</text>
<rect x="410" y="140" width="140" height="80" class="box3" /><text x="480" y="185" class="label" text-anchor="middle">C</text>
<text x="310" y="260" class="small" text-anchor="middle">프로세스가 연속된 공간을 차지한다.</text>
<text x="820" y="105" class="label" text-anchor="middle">불연속 할당</text>
<rect x="620" y="140" width="80" height="80" class="box" /><text x="660" y="185" class="small" text-anchor="middle">A1</text>
<rect x="720" y="140" width="100" height="80" class="box2" /><text x="770" y="185" class="label" text-anchor="middle">B</text>
<rect x="840" y="140" width="80" height="80" class="box" /><text x="880" y="185" class="small" text-anchor="middle">A2</text>
<rect x="940" y="140" width="90" height="80" class="box3" /><text x="985" y="185" class="label" text-anchor="middle">C</text>
<text x="820" y="260" class="small" text-anchor="middle">프로세스가 여러 위치에 나뉘어 저장될 수 있다.</text>
<rect x="120" y="380" width="860" height="150" class="warn" />
<text x="550" y="425" class="label" text-anchor="middle">단편화</text>
<text x="550" y="465" class="small" text-anchor="middle">내부 단편화: 할당은 되었지만 내부에 남는 공간이 생기는 문제</text>
<text x="550" y="500" class="small" text-anchor="middle">외부 단편화: 총 빈 공간은 충분하지만 연속 공간이 부족한 문제</text>

</svg>