<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520">
  <style>
    text{font-family:Arial,'Noto Sans KR',sans-serif;fill:#222}.title{font-size:30px;font-weight:700}.box{fill:#f8f7ff;stroke:#7b61ff;stroke-width:3}.server{fill:#eef2ff;stroke:#4f46e5;stroke-width:3}.label{font-size:22px;font-weight:700}.small{font-size:17px}.code{font-family:Consolas,monospace;font-size:20px}.arrow{stroke:#555;stroke-width:3;marker-end:url(#arrow)}
  </style>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#555"/></marker></defs>
  <text x="450" y="55" text-anchor="middle" class="title">프로세스, Job, SSH의 관계</text>
  <rect x="70" y="110" width="220" height="135" rx="18" class="box"/><text x="180" y="150" text-anchor="middle" class="label">Terminal</text><text x="180" y="185" text-anchor="middle" class="code">python app.py &amp;</text><text x="180" y="215" text-anchor="middle" class="small">백그라운드 Job 실행</text>
  <line x1="290" y1="177" x2="385" y2="177" class="arrow"/>
  <rect x="385" y="110" width="220" height="135" rx="18" class="box"/><text x="495" y="150" text-anchor="middle" class="label">Process</text><text x="495" y="185" text-anchor="middle" class="small">PID로 식별</text><text x="495" y="215" text-anchor="middle" class="code">ps, kill</text>
  <line x1="605" y1="177" x2="700" y2="177" class="arrow"/>
  <rect x="700" y="110" width="140" height="135" rx="18" class="server"/><text x="770" y="150" text-anchor="middle" class="label">Kernel</text><text x="770" y="185" text-anchor="middle" class="small">프로세스 관리</text>
  <rect x="180" y="330" width="220" height="95" rx="18" class="box"/><text x="290" y="367" text-anchor="middle" class="label">내 컴퓨터</text><text x="290" y="397" text-anchor="middle" class="code">ssh user@server</text>
  <line x1="400" y1="377" x2="500" y2="377" class="arrow"/><text x="450" y="355" text-anchor="middle" class="small">암호화 통신</text>
  <rect x="500" y="330" width="220" height="95" rx="18" class="server"/><text x="610" y="367" text-anchor="middle" class="label">원격 리눅스 서버</text><text x="610" y="397" text-anchor="middle" class="small">명령 실행</text>
</svg>
