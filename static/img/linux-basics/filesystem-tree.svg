<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520">
  <style>
    text{font-family:Arial,'Noto Sans KR',sans-serif;fill:#222}.title{font-size:30px;font-weight:700}.node{fill:#f5f3ff;stroke:#7b61ff;stroke-width:3}.root{fill:#ede9fe}.label{font-size:22px;font-weight:700}.small{font-size:17px}.line{stroke:#555;stroke-width:3}
  </style>
  <text x="450" y="55" text-anchor="middle" class="title">리눅스 파일 시스템은 트리 구조다</text>
