<svg xmlns="http://www.w3.org/2000/svg" width="920" height="530" viewBox="0 0 920 530">
  <rect width="920" height="530" fill="#fbfbff"/>
  <text x="460" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#2d2a64">집합 연산자 개념</text>
  <g font-family="Arial, sans-serif" font-size="18">
    <g transform="translate(40,90)">
      <text x="110" y="0" text-anchor="middle" font-size="22" font-weight="700" fill="#2d2a64">UNION</text>
      <circle cx="80" cy="100" r="70" fill="#6b62d6" fill-opacity=".55"/>
      <circle cx="140" cy="100" r="70" fill="#2a9d66" fill-opacity=".55"/>
      <text x="110" y="210" text-anchor="middle">합집합</text>
    </g>
    <g transform="translate(260,90)">
      <text x="110" y="0" text-anchor="middle" font-size="22" font-weight="700" fill="#2d2a64">INTERSECT</text>
      <circle cx="80" cy="100" r="70" fill="#c9c4ff" fill-opacity=".4" stroke="#6b62d6" stroke-width="2"/>
      <circle cx="140" cy="100" r="70" fill="#b5e7d3" fill-opacity=".4" stroke="#2a9d66" stroke-width="2"/>
      <path d="M110 38 A70 70 0 0 1 110 162 A70 70 0 0 1 110 38" fill="#6b62d6" fill-opacity=".65"/>
      <text x="110" y="210" text-anchor="middle">교집합</text>
    </g>
    <g transform="translate(510,90)">
      <text x="110" y="0" text-anchor="middle" font-size="22" font-weight="700" fill="#2d2a64">EXCEPT</text>
      <circle cx="80" cy="100" r="70" fill="#6b62d6" fill-opacity=".65"/>
      <circle cx="140" cy="100" r="70" fill="#fff" fill-opacity=".8" stroke="#2a9d66" stroke-width="2"/>
      <text x="110" y="210" text-anchor="middle">차집합</text>
    </g>
    <g transform="translate(715,90)">
      <text x="90" y="0" text-anchor="middle" font-size="22" font-weight="700" fill="#2d2a64">CROSS JOIN</text>
      <rect x="15" y="45" width="70" height="45" fill="#f0efff" stroke="#6b62d6"/>
      <rect x="95" y="45" width="70" height="45" fill="#eef9f4" stroke="#2a9d66"/>
      <text x="50" y="74" text-anchor="middle">A</text><text x="130" y="74" text-anchor="middle">B</text>
      <text x="90" y="125" text-anchor="middle">모든 조합</text>
      <text x="90" y="210" text-anchor="middle">카티션 곱</text>
    </g>
  </g>
</svg>