<svg xmlns="http://www.w3.org/2000/svg" width="920" height="500" viewBox="0 0 920 500">
  <rect width="920" height="500" fill="#fbfbff"/>
  <text x="460" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#2d2a64">서브쿼리의 실행 흐름</text>
  <g font-family="Arial, sans-serif">
    <rect x="80" y="110" width="310" height="105" rx="16" fill="#ffffff" stroke="#6b62d6" stroke-width="3"/>
    <text x="235" y="145" text-anchor="middle" font-size="22" font-weight="700" fill="#2d2a64">서브쿼리</text>
    <text x="235" y="180" text-anchor="middle" font-size="17" fill="#333">평균 creditLimit 계산</text>

    <rect x="530" y="110" width="310" height="105" rx="16" fill="#ffffff" stroke="#6b62d6" stroke-width="3"/>
    <text x="685" y="145" text-anchor="middle" font-size="22" font-weight="700" fill="#2d2a64">메인쿼리</text>
    <text x="685" y="180" text-anchor="middle" font-size="17" fill="#333">평균보다 큰 고객 조회</text>

    <line x1="390" y1="162" x2="530" y2="162" stroke="#3d3b8f" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="460" y="143" text-anchor="middle" font-size="16" fill="#555">결과 전달</text>

    <rect x="175" y="295" width="570" height="110" rx="16" fill="#f0efff" stroke="#6b62d6" stroke-width="2"/>
    <text x="460" y="330" text-anchor="middle" font-size="18" font-weight="700" fill="#2d2a64">WHERE creditLimit &gt; (SELECT AVG(creditLimit) FROM customers)</text>
    <text x="460" y="368" text-anchor="middle" font-size="16" fill="#333">괄호 안의 SELECT가 기준값을 만들고, 바깥 SELECT가 그 기준으로 데이터를 필터링한다.</text>
  </g>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#3d3b8f"/>
    </marker>
  </defs>
</svg>