<svg xmlns="http://www.w3.org/2000/svg" width="920" height="520" viewBox="0 0 920 520">
  <rect width="920" height="520" fill="#fbfbff"/>
  <text x="460" y="46" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#2d2a64">관계형 데이터베이스의 기본 구조</text>
  <g font-family="Arial, sans-serif">
    <rect x="80" y="95" width="260" height="320" rx="16" fill="#ffffff" stroke="#6b62d6" stroke-width="3"/>
    <rect x="80" y="95" width="260" height="58" rx="16" fill="#6b62d6"/>
    <text x="210" y="132" text-anchor="middle" font-size="21" font-weight="700" fill="#fff">customers</text>
    <line x1="80" y1="153" x2="340" y2="153" stroke="#6b62d6" stroke-width="3"/>
    <text x="110" y="192" font-size="17" fill="#19193a">customerNumber PK</text>
    <text x="110" y="232" font-size="17" fill="#19193a">customerName</text>
    <text x="110" y="272" font-size="17" fill="#19193a">country</text>
    <text x="110" y="312" font-size="17" fill="#19193a">creditLimit</text>
    <text x="110" y="352" font-size="17" fill="#19193a">salesRepEmployeeNumber</text>

    <rect x="580" y="95" width="260" height="320" rx="16" fill="#ffffff" stroke="#6b62d6" stroke-width="3"/>
    <rect x="580" y="95" width="260" height="58" rx="16" fill="#6b62d6"/>
    <text x="710" y="132" text-anchor="middle" font-size="21" font-weight="700" fill="#fff">orders</text>
    <line x1="580" y1="153" x2="840" y2="153" stroke="#6b62d6" stroke-width="3"/>
    <text x="610" y="192" font-size="17" fill="#19193a">orderNumber PK</text>
    <text x="610" y="232" font-size="17" fill="#19193a">orderDate</text>
    <text x="610" y="272" font-size="17" fill="#19193a">status</text>
    <text x="610" y="312" font-size="17" fill="#19193a">customerNumber FK</text>

    <line x1="340" y1="250" x2="580" y2="250" stroke="#3d3b8f" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="460" y="226" text-anchor="middle" font-size="18" fill="#222">customerNumber 기준 연결</text>
    <text x="460" y="282" text-anchor="middle" font-size="16" fill="#555">JOIN ON customers.customerNumber = orders.customerNumber</text>
  </g>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#3d3b8f"/>
    </marker>
  </defs>
</svg>