<svg xmlns="http://www.w3.org/2000/svg" width="920" height="520" viewBox="0 0 920 520">
  <rect width="920" height="520" fill="#fbfbff"/>
  <text x="460" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#2d2a64">INNER JOIN과 LEFT JOIN의 차이</text>
  <g font-family="Arial, sans-serif" font-size="18">
    <text x="230" y="98" text-anchor="middle" font-size="23" font-weight="700" fill="#2d2a64">INNER JOIN</text>
    <circle cx="190" cy="230" r="100" fill="#c9c4ff" fill-opacity=".55" stroke="#6b62d6" stroke-width="3"/>
    <circle cx="280" cy="230" r="100" fill="#b5e7d3" fill-opacity=".55" stroke="#2a9d66" stroke-width="3"/>
    <path d="M235 141 A100 100 0 0 1 235 319 A100 100 0 0 1 235 141" fill="#6b62d6" fill-opacity=".65"/>
    <text x="160" y="230" text-anchor="middle" fill="#333">왼쪽</text>
    <text x="310" y="230" text-anchor="middle" fill="#333">오른쪽</text>
    <text x="235" y="372" text-anchor="middle" fill="#222">겹치는 데이터만 조회</text>

    <text x="690" y="98" text-anchor="middle" font-size="23" font-weight="700" fill="#2d2a64">LEFT JOIN</text>
    <circle cx="650" cy="230" r="100" fill="#6b62d6" fill-opacity=".70" stroke="#6b62d6" stroke-width="3"/>
    <circle cx="740" cy="230" r="100" fill="#b5e7d3" fill-opacity=".30" stroke="#2a9d66" stroke-width="3"/>
    <text x="620" y="230" text-anchor="middle" fill="#fff" font-weight="700">왼쪽</text>
    <text x="770" y="230" text-anchor="middle" fill="#333">오른쪽</text>
    <text x="690" y="372" text-anchor="middle" fill="#222">왼쪽 테이블은 모두 유지</text>
  </g>
</svg>